
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinjamKu - Pinjaman Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN SELAMAT DATANG -->
    <div id="halamanAwal">
        <div class="welcome-box">
            <h1>🌸 Selamat Datang 🌸</h1>
            <h2>Di Peminjaman Online</h2>
            <p>PinjamKu - Solusi Pinjaman Mudah dan Cepat</p>

            <button onclick="masukWebsite()">
                Masuk Sekarang
            </button>
        </div>
    </div>

    <!-- HALAMAN UTAMA -->
    <div id="halamanUtama" style="display: none;">

        <div class="container">

            <h1>PinjamKu</h1>
            <p>Layanan Peminjaman Online</p>

            <div class="form-box">

                <h2>Formulir Pengajuan Pinjaman</h2>

                <label>Nama Lengkap</label>
                <input type="text" id="nama"
                placeholder="Masukkan nama lengkap">

                <label>Jumlah Pinjaman (Rp)</label>
                <input type="number" id="jumlah"
                placeholder="Masukkan jumlah pinjaman">

                <label>Jangka Waktu</label>
                <select id="waktu">
                    <option value="3">3 Bulan</option>
                    <option value="6">6 Bulan</option>
                    <option value="12">12 Bulan</option>
                </select>

                <button onclick="hitungPinjaman()">
                    Hitung Cicilan
                </button>

                <div id="hasil"></div>

                <button onclick="ajukanPinjaman()">
                    Ajukan Pinjaman
                </button>

            </div>

            <footer>
                © 2026 PinjamKu
                <br>
                Aplikasi Simulasi Peminjaman Online
            </footer>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
